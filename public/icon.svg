<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1e3a8a" />
      <stop offset="100%" stopColor="#0f172a" />
    </linearGradient>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#0284c7" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Outer Ring Glow -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#60a5fa" stroke-width="4" opacity="0.3" />

  <!-- Globe Ocean Base -->
  <circle cx="256" cy="256" r="160" fill="url(#globeGrad)" filter="url(#dropShadow)" />

  <!-- Continents -->
  <path d="M 230 150 Q 280 140 310 170 Q 330 200 300 230 Q 320 260 290 310 Q 260 340 230 320 Q 210 280 230 240 Q 210 200 230 150 Z" fill="#10b981" />
  <path d="M 170 160 Q 200 150 210 180 Q 190 220 180 250 Q 190 280 180 320 Q 150 300 150 240 Q 140 190 170 160 Z" fill="#34d399" />
  <circle cx="345" cy="310" r="24" fill="#10b981" />

  <!-- Lines -->
  <ellipse cx="256" cy="256" rx="160" ry="60" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.25" />
  <ellipse cx="256" cy="256" rx="70" ry="160" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.25" />
  <line x1="96" y1="256" x2="416" y2="256" stroke="#ffffff" stroke-width="3" opacity="0.25" />

  <!-- Star Location Beacon -->
  <g transform="translate(256, 120)">
    <circle cx="0" cy="0" r="16" fill="#f59e0b" filter="url(#dropShadow)" />
    <circle cx="0" cy="0" r="8" fill="#ffffff" />
  </g>
</svg>
